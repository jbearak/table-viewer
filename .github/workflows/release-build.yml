name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.1)'
        required: true
        type: string

concurrency:
  group: release-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Validate tag + version
        shell: bash
        env:
          THE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$THE_TAG" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v0.1.1). Got: $THE_TAG" >&2
            exit 1
          fi

          if [[ "$THE_TAG" =~ [[:space:]] ]]; then
            echo "ERROR: tag must not contain whitespace. Got: $THE_TAG" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$THE_TAG" >/dev/null; then
            echo "ERROR: tag does not exist in this repository: $THE_TAG" >&2
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [[ "$THE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "ERROR: tag/version mismatch. tag=$THE_TAG package.json=$PKG_VERSION (expected tag $EXPECTED_TAG)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          for vsix in table-viewer-*.vsix; do
            sha256sum "$vsix" > "$vsix.sha256"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: release-${{ inputs.tag || github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            table-viewer-*.vsix
            table-viewer-*.vsix.sha256

  # The standalone macOS app (Apple Silicon), shipped as a dmg that the
  # Homebrew cask in jbearak/homebrew-table-viewer downloads by URL + sha256.
  # Separate from `build` so a macOS runner is only spent on the desktop
  # artifact, and so a desktop packaging failure is distinguishable from a
  # broken .vsix.
  desktop:
    runs-on: macos-latest
    # The Apple signing secrets live in the `release` environment, so this job
    # must run in it to read them. Note the consequence: if that environment
    # ever gains required reviewers, this build job waits for approval too, not
    # just release-publish. If that becomes unwanted, move the Apple secrets to
    # repo-level secrets and drop this line.
    environment: release

    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Validate tag + version
        shell: bash
        env:
          THE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$THE_TAG" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v0.1.1). Got: $THE_TAG" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$THE_TAG" >/dev/null; then
            echo "ERROR: tag does not exist in this repository: $THE_TAG" >&2
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$THE_TAG" != "v${PKG_VERSION}" ]]; then
            echo "ERROR: tag/version mismatch. tag=$THE_TAG package.json=$PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Signing and notarization activate themselves once the Apple credentials
      # exist as `release` environment secrets; until then the job produces the
      # same unsigned dmg a local `npm run desktop:package` does, and the cask
      # documents the Gatekeeper first-launch step.
      #
      # Setup (one-time), all in the `release` environment:
      #   CSC_LINK                     base64 of a Developer ID Application .p12
      #   CSC_KEY_PASSWORD             that .p12's password
      #   APPLE_ID                     Apple ID email for notarytool
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
      #   APPLE_TEAM_ID                10-character Developer Team ID
      - name: Decide whether to sign
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CSC_LINK secret - producing an unsigned build."
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CSC_LINK is set but the notarytool credentials are incomplete; shipping signed-but-not-notarized. Gatekeeper will still warn."
          fi

      - name: Package desktop app (signed)
        if: steps.signing.outputs.sign == 'true'
        run: >-
          npm run desktop:package:release --
          -c.mac.notarize=${{ steps.signing.outputs.notarize }}
          -c.dmg.sign=true
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Read by electron-builder's notarytool step when notarize is true.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package desktop app (unsigned)
        if: steps.signing.outputs.sign != 'true'
        run: npm run desktop:package:release -- -c.mac.identity=null -c.dmg.sign=false
        env:
          # A hosted runner has no Developer ID in its keychain, but be explicit:
          # auto-discovery finding one would make the artifact non-reproducible.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The cask pins an exact download URL, so the artifact names are part of
      # the contract with jbearak/homebrew-table-viewer. Assert there is exactly
      # one dmg and one zip rather than trusting the glob.
      - name: Calculate checksums
        shell: bash
        working-directory: dist/desktop-packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ext in dmg zip; do
            files=(table-viewer-*.$ext)
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "ERROR: expected exactly 1 .$ext, found ${#files[@]}. Did artifactName change?" >&2
              ls -la >&2
              exit 1
            fi
            shasum -a 256 "${files[0]}" | tee "${files[0]}.sha256"
          done

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: desktop-${{ inputs.tag || github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/desktop-packages/table-viewer-*.dmg
            dist/desktop-packages/table-viewer-*.zip
            dist/desktop-packages/*.sha256

  # The standalone Windows app: an NSIS installer and a portable single-file
  # exe, each for x64 and arm64. Its own job because electron-builder's Windows
  # targets must be built on Windows, and so that a Windows packaging failure
  # is immediately attributable rather than hidden inside the macOS job.
  #
  # It is NOT isolated in the blast-radius sense, and that is deliberate: this
  # job failing fails the whole Release Build run, and release-publish.yml only
  # triggers on `workflow_run.conclusion == 'success'`, so nothing publishes
  # until the Windows build is fixed and the run re-run. The alternative
  # (continue-on-error) would quietly ship a release missing its Windows
  # downloads. The missing-artifact tolerance on the publish side is for a
  # different case: old tags built before this job existed, and runs whose
  # artifacts have aged out.
  #
  # Deliberately no `environment: release` here: unlike the macOS job there are
  # no secrets to read. Windows builds ship unsigned — an Authenticode
  # certificate is a paid annual subscription we have chosen not to buy, so
  # SmartScreen shows its "Windows protected your PC" prompt on first run and
  # the user clicks More info -> Run anyway. That is documented in the README.
  desktop-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          # The job never runs an authenticated git or gh command — only a local
          # `git rev-parse` against the fetched tag — so there is no reason to
          # leave the job token in .git/config where a package script could
          # reach it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Validate tag + version
        shell: bash
        env:
          THE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$THE_TAG" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v0.1.1). Got: $THE_TAG" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$THE_TAG" >/dev/null; then
            echo "ERROR: tag does not exist in this repository: $THE_TAG" >&2
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$THE_TAG" != "v${PKG_VERSION}" ]]; then
            echo "ERROR: tag/version mismatch. tag=$THE_TAG package.json=$PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Package desktop app (unsigned)
        run: npm run desktop:package:win
        env:
          # No Authenticode certificate is configured, and a runner picking one
          # up from its certificate store would make the artifact
          # non-reproducible. Be explicit rather than relying on there being
          # none to find.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Four exes are expected: {x64,arm64} x {setup,portable}. Assert the count
      # rather than trusting the glob, so a silently dropped target shows up
      # here and not as a missing download on the release page.
      - name: Calculate checksums
        shell: bash
        working-directory: dist/desktop-packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(table-viewer-*.exe)
          if [[ "${#exes[@]}" -ne 4 ]]; then
            echo "ERROR: expected 4 .exe files (x64/arm64 x setup/portable), found ${#exes[@]}." >&2
            ls -la >&2
            exit 1
          fi
          for exe in "${exes[@]}"; do
            sha256sum "$exe" | tee "$exe.sha256"
          done

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: windows-${{ inputs.tag || github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/desktop-packages/table-viewer-*.exe
            dist/desktop-packages/table-viewer-*.exe.sha256
