name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.1)'
        required: true
        type: string

concurrency:
  group: release-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Validate the immutable release commit on Windows before the VSIX can be
  # packaged or uploaded. Keeping these gates in the tag workflow prevents a
  # successful independent CI run for some other commit from vouching for the
  # release, and prevents release-publish from racing ahead of a Windows failure.
  windows-validation:
    runs-on: windows-latest

    steps:
      - name: Resolve immutable tag commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$THE_TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "ERROR: invalid release tag: $THE_TAG" >&2
            exit 1
          fi
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${THE_TAG}")
          TYPE=$(jq -r '.object.type' <<<"$OBJECT")
          SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          for _ in 1 2 3 4; do
            [[ "$TYPE" == "commit" ]] && break
            [[ "$TYPE" == "tag" ]] || { echo "ERROR: release tag did not resolve to a commit" >&2; exit 1; }
            OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}")
            TYPE=$(jq -r '.object.type' <<<"$OBJECT")
            SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          done
          if [[ "$TYPE" != "commit" || ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release tag did not peel to a commit" >&2
            exit 1
          fi
          if [[ "$SHA" != "$EVENT_SHA" ]]; then
            echo "ERROR: release tag does not resolve to the immutable event commit" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tag commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout matches tag commit
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "ERROR: checkout does not match the resolved immutable tag commit" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SQLite public-open contract test
        run: npm run test:sqlite:public-open

      - name: Host Node SQLite runtime probe
        run: npm run probe:sqlite:host

      - name: Server bundle SQLite externalization probe
        run: npm run probe:sqlite:bundles

      - name: Electron SQLite runtime probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run bundle:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\node_modules\.bin\electron.cmd dist\runtime-probes\electron-sqlite-runtime-probe.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Packaged SQLite recovery gates
        shell: pwsh
        env:
          TABLE_VIEWER_GATE_EXPECT_PLATFORM: supported
        run: |
          $ErrorActionPreference = 'Stop'
          npm run bundle:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\node_modules\.bin\electron.cmd dist\runtime-probes\packaged-recovery-gate.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    needs: windows-validation
    runs-on: ubuntu-latest

    steps:
      - name: Resolve immutable tag commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$THE_TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "ERROR: invalid release tag: $THE_TAG" >&2
            exit 1
          fi
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${THE_TAG}")
          TYPE=$(jq -r '.object.type' <<<"$OBJECT")
          SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          for _ in 1 2 3 4; do
            [[ "$TYPE" == "commit" ]] && break
            [[ "$TYPE" == "tag" ]] || { echo "ERROR: release tag did not resolve to a commit" >&2; exit 1; }
            OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}")
            TYPE=$(jq -r '.object.type' <<<"$OBJECT")
            SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          done
          if [[ "$TYPE" != "commit" || ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release tag did not peel to a commit" >&2
            exit 1
          fi
          if [[ "$SHA" != "$EVENT_SHA" ]]; then
            echo "ERROR: release tag does not resolve to the immutable event commit" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tag commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Validate tag + versions
        id: version
        shell: bash
        env:
          THE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$THE_TAG" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v0.1.1). Got: $THE_TAG" >&2
            exit 1
          fi

          if [[ "$THE_TAG" =~ [[:space:]] ]]; then
            echo "ERROR: tag must not contain whitespace. Got: $THE_TAG" >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "ERROR: checkout does not match the resolved immutable tag commit" >&2
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [[ "$THE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "ERROR: tag/version mismatch. tag=$THE_TAG package.json=$PKG_VERSION (expected tag $EXPECTED_TAG)" >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Calculate extension checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VSIX="table-viewer-${VERSION}.vsix"
          sha256sum "$VSIX" > "$VSIX.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: release-${{ inputs.tag || github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            table-viewer-${{ steps.version.outputs.version }}.vsix
            table-viewer-${{ steps.version.outputs.version }}.vsix.sha256

  # The standalone macOS app (Apple Silicon), shipped as a dmg that the
  # Homebrew cask in jbearak/homebrew-table-viewer downloads by URL + sha256.
  # Separate from `build` so a macOS runner is only spent on the desktop
  # artifact, and so a desktop packaging failure is distinguishable from a
  # broken .vsix.
  desktop:
    runs-on: macos-latest
    # The Apple signing secrets live in the `release` environment, so this job
    # must run in it to read them. Note the consequence: if that environment
    # ever gains required reviewers, this build job waits for approval too, not
    # just release-publish. If that becomes unwanted, move the Apple secrets to
    # repo-level secrets and drop this line.
    environment: release

    steps:
      - name: Resolve immutable tag commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$THE_TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "ERROR: invalid release tag: $THE_TAG" >&2
            exit 1
          fi
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${THE_TAG}")
          TYPE=$(jq -r '.object.type' <<<"$OBJECT")
          SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          for _ in 1 2 3 4; do
            [[ "$TYPE" == "commit" ]] && break
            [[ "$TYPE" == "tag" ]] || { echo "ERROR: release tag did not resolve to a commit" >&2; exit 1; }
            OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}")
            TYPE=$(jq -r '.object.type' <<<"$OBJECT")
            SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          done
          if [[ "$TYPE" != "commit" || ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release tag did not peel to a commit" >&2
            exit 1
          fi
          if [[ "$SHA" != "$EVENT_SHA" ]]; then
            echo "ERROR: release tag does not resolve to the immutable event commit" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tag commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Validate tag + version
        shell: bash
        env:
          THE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$THE_TAG" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v0.1.1). Got: $THE_TAG" >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "ERROR: checkout does not match the resolved immutable tag commit" >&2
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$THE_TAG" != "v${PKG_VERSION}" ]]; then
            echo "ERROR: tag/version mismatch. tag=$THE_TAG package.json=$PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Signing and notarization activate themselves once the Apple credentials
      # exist as `release` environment secrets; until then the job produces the
      # same unsigned dmg a local `npm run desktop:package` does, and the cask
      # documents the Gatekeeper first-launch step.
      #
      # Setup (one-time), all in the `release` environment:
      #   CSC_LINK                     base64 of a Developer ID Application .p12
      #   CSC_KEY_PASSWORD             that .p12's password
      #   APPLE_ID                     Apple ID email for notarytool
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
      #   APPLE_TEAM_ID                10-character Developer Team ID
      - name: Decide whether to sign
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CSC_LINK secret - producing an unsigned build."
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CSC_LINK is set but the notarytool credentials are incomplete; shipping signed-but-not-notarized. Gatekeeper will still warn."
          fi

      - name: Package desktop app (signed)
        if: steps.signing.outputs.sign == 'true'
        run: >-
          npm run desktop:package:release --
          -c.mac.notarize=${{ steps.signing.outputs.notarize }}
          -c.dmg.sign=true
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Read by electron-builder's notarytool step when notarize is true.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package desktop app (unsigned)
        if: steps.signing.outputs.sign != 'true'
        run: npm run desktop:package:release -- -c.mac.identity=null -c.dmg.sign=false
        env:
          # A hosted runner has no Developer ID in its keychain, but be explicit:
          # auto-discovery finding one would make the artifact non-reproducible.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The cask pins an exact download URL, so the artifact names are part of
      # the contract with jbearak/homebrew-table-viewer. Assert there is exactly
      # one dmg and one zip rather than trusting the glob.
      - name: Calculate checksums
        shell: bash
        working-directory: dist/desktop-packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ext in dmg zip; do
            files=(table-viewer-*."${ext}")
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "ERROR: expected exactly 1 .$ext, found ${#files[@]}. Did artifactName change?" >&2
              ls -la >&2
              exit 1
            fi
            shasum -a 256 "${files[0]}" | tee "${files[0]}.sha256"
          done

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: desktop-${{ inputs.tag || github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/desktop-packages/table-viewer-*.dmg
            dist/desktop-packages/table-viewer-*.zip
            dist/desktop-packages/*.sha256

  # The Windows desktop release fence.
  #
  # This job used to package an NSIS installer and a portable exe for x64 and
  # arm64. It packages nothing today, on purpose — but it no longer fails, and
  # that distinction is the whole of this block.
  #
  # The desktop's state authority is SQLite, and it does now open on Windows: every
  # durable step of the storage protocol — candidate install, marker creation,
  # member move — attempts to flush the containing directory. The default Node
  # primitive is tried so future runtime support is used; only a directory-open
  # result proving no handle can be obtained is skipped, in line with SQLite's own
  # Windows posture. `desktop_state_platform_support` no longer declines Windows.
  #
  # What is still missing is *crash* evidence, and that is what fences this job.
  # `fs.openSync` on a directory fails and `FlushFileBuffers` on a file handle says
  # nothing about rename and unlink ordering, so what a kill at each durable cut
  # point leaves behind on NTFS has not been established from the packaged runtime.
  # Shipping an installer before it is would put real users' view state on an
  # unverified recovery path, which is the one thing the failure policy will not
  # trade away.
  #
  # An earlier revision of this job failed hard, which stopped the *entire*
  # release run — `release-publish.yml` triggers only on a successful Release Build,
  # so a fenced Windows packaging job also withheld the macOS build. That coupling
  # is withdrawn. Windows being unproven is not a reason to stop shipping the
  # platform that is proven. A pushed-tag publish warns and proceeds when the
  # expected fenced `windows-<tag>` artifact is absent; a hand-dispatched publish
  # requires `allow_missing_windows=true` to acknowledge that omission explicitly.
  # This job therefore skips loudly and lets the run proceed.
  #
  # Windows is not withdrawn as a target. The open question is empirical — which
  # write-through and flush primitives the packaged runtime can actually reach on
  # NTFS, and what they guarantee across a kill — and it is answered by the
  # `windows-durability` job in ci.yml, not by argument here. The decision tree is
  # fixed in advance so neither outcome can be quietly reinterpreted:
  #
  #   * the durability gate verifies  -> Windows ships on the same evidence
  #     standard as macOS: a documented durability contract plus kill-crash
  #     verification, which is exactly the trust basis fsync gives us on POSIX.
  #     Replace this job with the real packaging steps.
  #   * the gate cannot verify        -> this fence stays, and the reason stays
  #     stated: the backend runs on Windows, but its crash recovery there is not
  #     verified, so the desktop app is not published for it.
  #
  # Neither branch permits a silent weakening: shipping requires the evidence, and
  # not shipping requires saying so. `npm run desktop:package:win` remains
  # available for developers either way — a local build, never a published one.

  desktop-windows:
    runs-on: windows-latest

    steps:
      # No checkout, no toolchain, no dependencies. Nothing this job could
      # install would change the answer today, and a job that built anything at
      # all would leave something for a future step to pick up and upload.
      #
      # Exits 0. The release run continues and the macOS artifact publishes.
      # release-publish.yml warns and proceeds for a successful pushed-tag build;
      # only a hand-dispatched publish requires `allow_missing_windows=true`.
      - name: Report that Windows desktop packaging is pending durability verification
        shell: bash
        run: |
          set -euo pipefail
          cat >&2 <<'MESSAGE'
          NOTE: no Windows desktop artifact is produced by this release.

          The desktop app stores its view settings in SQLite, and it does open that
          database on Windows. Every durable step attempts the default Node directory
          flush so future runtime support is used; only a directory-open result proving
          that no handle can be obtained is skipped, in line with SQLite's own Windows
          posture.

          What has NOT been established is what a crash at each of those durable
          steps leaves behind on NTFS, measured from the packaged runtime. Publishing
          an installer today would put real users' view state on a recovery path
          nobody has verified, so the fence stays until the evidence exists.

          Windows is NOT withdrawn as a target. Which primitives are actually
          reachable, and what they guarantee across a kill, is being established
          empirically by the `windows-durability` job in ci.yml. When that gate
          verifies, Windows ships on the same evidence standard as macOS — a
          documented durability contract plus kill-crash verification — and this job
          is replaced with the real packaging steps. If it cannot verify, this fence
          and this message stay exactly as they are.

          This job no longer fails the release run: Windows being unproven is not a
          reason to withhold the platform that is proven. A pushed-tag publish reports
          the omitted Windows assets; a manual publish requires an explicit override.

          Developers can still build locally with: npm run desktop:package:win
          MESSAGE
