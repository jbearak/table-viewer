name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.1)'
        required: true
        type: string

concurrency:
  group: release-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Validate tag + version
        shell: bash
        env:
          THE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$THE_TAG" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v0.1.1). Got: $THE_TAG" >&2
            exit 1
          fi

          if [[ "$THE_TAG" =~ [[:space:]] ]]; then
            echo "ERROR: tag must not contain whitespace. Got: $THE_TAG" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$THE_TAG" >/dev/null; then
            echo "ERROR: tag does not exist in this repository: $THE_TAG" >&2
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [[ "$THE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "ERROR: tag/version mismatch. tag=$THE_TAG package.json=$PKG_VERSION (expected tag $EXPECTED_TAG)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          for vsix in table-viewer-*.vsix; do
            sha256sum "$vsix" > "$vsix.sha256"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: release-${{ inputs.tag || github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            table-viewer-*.vsix
            table-viewer-*.vsix.sha256

  # The standalone macOS app (Apple Silicon), shipped as a dmg that the
  # Homebrew cask in jbearak/homebrew-table-viewer downloads by URL + sha256.
  # Separate from `build` so a macOS runner is only spent on the desktop
  # artifact, and so a desktop packaging failure is distinguishable from a
  # broken .vsix.
  desktop:
    runs-on: macos-latest
    # The Apple signing secrets live in the `release` environment, so this job
    # must run in it to read them. Note the consequence: if that environment
    # ever gains required reviewers, this build job waits for approval too, not
    # just release-publish. If that becomes unwanted, move the Apple secrets to
    # repo-level secrets and drop this line.
    environment: release

    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Validate tag + version
        shell: bash
        env:
          THE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$THE_TAG" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v0.1.1). Got: $THE_TAG" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$THE_TAG" >/dev/null; then
            echo "ERROR: tag does not exist in this repository: $THE_TAG" >&2
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$THE_TAG" != "v${PKG_VERSION}" ]]; then
            echo "ERROR: tag/version mismatch. tag=$THE_TAG package.json=$PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Signing and notarization activate themselves once the Apple credentials
      # exist as `release` environment secrets; until then the job produces the
      # same unsigned dmg a local `npm run desktop:package` does, and the cask
      # documents the Gatekeeper first-launch step.
      #
      # Setup (one-time), all in the `release` environment:
      #   CSC_LINK                     base64 of a Developer ID Application .p12
      #   CSC_KEY_PASSWORD             that .p12's password
      #   APPLE_ID                     Apple ID email for notarytool
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
      #   APPLE_TEAM_ID                10-character Developer Team ID
      - name: Decide whether to sign
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CSC_LINK secret - producing an unsigned build."
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CSC_LINK is set but the notarytool credentials are incomplete; shipping signed-but-not-notarized. Gatekeeper will still warn."
          fi

      - name: Package desktop app (signed)
        if: steps.signing.outputs.sign == 'true'
        run: >-
          npm run desktop:package:release --
          -c.mac.notarize=${{ steps.signing.outputs.notarize }}
          -c.dmg.sign=true
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Read by electron-builder's notarytool step when notarize is true.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package desktop app (unsigned)
        if: steps.signing.outputs.sign != 'true'
        run: npm run desktop:package:release -- -c.mac.identity=null -c.dmg.sign=false
        env:
          # A hosted runner has no Developer ID in its keychain, but be explicit:
          # auto-discovery finding one would make the artifact non-reproducible.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The cask pins an exact download URL, so the artifact names are part of
      # the contract with jbearak/homebrew-table-viewer. Assert there is exactly
      # one dmg and one zip rather than trusting the glob.
      - name: Calculate checksums
        shell: bash
        working-directory: dist/desktop-packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ext in dmg zip; do
            files=(table-viewer-*.$ext)
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "ERROR: expected exactly 1 .$ext, found ${#files[@]}. Did artifactName change?" >&2
              ls -la >&2
              exit 1
            fi
            shasum -a 256 "${files[0]}" | tee "${files[0]}.sha256"
          done

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: desktop-${{ inputs.tag || github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/desktop-packages/table-viewer-*.dmg
            dist/desktop-packages/table-viewer-*.zip
            dist/desktop-packages/*.sha256

  # The Windows desktop release fence.
  #
  # This job used to package an NSIS installer and a portable exe for x64 and
  # arm64. It now packages nothing, on purpose: the desktop's state authority is
  # SQLite, and this build cannot open a SQLite state database on Windows at all.
  # Every durable step of the storage protocol — candidate install, marker
  # creation, member move — is made durable by flushing the containing directory,
  # Node exposes no proven win32 primitive for that (`fs.openSync` on a directory
  # fails, and `FlushFileBuffers` on a file handle says nothing about rename and
  # unlink ordering), and a real primitive would need a native addon that the
  # packaging contract forbids (desktop/check-sqlite-bundle-externals.mjs,
  # desktop/after-pack.mjs, desktop/README.md). So `desktop_state_platform_support`
  # declines the platform up front and the app reports one honest, non-looping
  # refusal. The failure policy forbids the alternative outright: no empty and no
  # read-only authority.
  #
  # Shipping a Windows exe in that state would ship a viewer whose settings
  # silently never persist. There is no correct artifact to publish, so this job
  # publishes none — and fails, loudly, rather than being deleted.
  #
  # Failing rather than removing is the whole point, and it follows from the
  # mechanics the previous comment here documented: this job failing fails the
  # entire Release Build run, and release-publish.yml only triggers on
  # `workflow_run.conclusion == 'success'`. So while this fence stands, *nothing*
  # publishes — not a broken Windows build, and not a macOS build that quietly
  # dropped its Windows downloads from the release page. Deleting the job would
  # instead let the run go green and publish a release whose Windows assets had
  # simply vanished, with no record of why: a silent change to what ships, which
  # is exactly the outcome this fence exists to prevent. A failing job with this
  # message cannot be reached by accident and cannot be satisfied by waiting.
  #
  # Removing the fence is therefore a deliberate act with a stated precondition,
  # not a cleanup: either a proven win32 directory-durability primitive exists
  # within the no-native-addon packaging contract, or the product decides Windows
  # desktop is not a supported target and its downloads are withdrawn on purpose.
  # Until one of those happens, `npm run desktop:package:win` remains available
  # for developers — it is a local build, not a published artifact.
  desktop-windows:
    runs-on: windows-latest

    steps:
      # No checkout, no toolchain, no dependencies. Nothing this job could
      # install would change the answer, and a job that built anything at all
      # would leave something for a future step to pick up and upload.
      - name: Refuse to package an unsupported Windows desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          cat >&2 <<'MESSAGE'
          ERROR: Windows desktop packaging is fenced off and this release cannot publish.

          The desktop app stores its view settings in SQLite, and this build cannot
          open that database on Windows: the storage protocol requires a durable
          directory flush, Node exposes no proven Windows primitive for one, and a
          native addon is forbidden by the packaging contract. The app declines the
          platform up front rather than running with an authority it cannot persist.

          A Windows exe built today would be a viewer whose settings never survive a
          restart, so no Windows artifact is produced and the whole release run fails
          rather than publishing without one.

          To lift this fence, one of the following must be true and this job replaced
          deliberately:
            * a proven Windows directory-durability primitive is available without a
              native addon, and the packaged recovery gate passes on windows-latest; or
            * Windows desktop is formally withdrawn as a target and its downloads are
              removed from the release page on purpose.

          Developers can still build locally with: npm run desktop:package:win
          MESSAGE
          exit 1
