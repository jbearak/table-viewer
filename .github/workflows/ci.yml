name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # No step pushes/fetches after checkout, so don't persist GITHUB_TOKEN
          # in .git/config (least privilege).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Electron (retry transient downloads)
        run: npm run desktop:ensure-electron

      # Covers all three projects: the extension + webview + unit tests
      # (tsconfig.json), the desktop shell (desktop/tsconfig.json), and the
      # integration tests (tsconfig.integration.json). The bundlers strip types
      # without checking them, so nothing else catches these.
      - name: Typecheck
        run: npm run typecheck:all

      - name: Unit tests (vitest)
        run: npm test

      - name: Host Node SQLite runtime probe
        run: npm run probe:sqlite:host

      - name: Server bundle SQLite externalization probe
        run: npm run probe:sqlite:bundles

      - name: Electron SQLite runtime probe
        # GitHub-hosted runners cannot configure Electron's root-owned SUID helper.
        # The probe opens no windows or untrusted content; disable Chromium's sandbox
        # only for this isolated runtime-capability check.
        run: npm run bundle:desktop && xvfb-run -a ./node_modules/.bin/electron --no-sandbox dist/runtime-probes/electron-sqlite-runtime-probe.js

      # The packaged-desktop release gates: initialization crash at every durable
      # cut point, rollback-journal recovery, sidecar fail-closed, and a crash at
      # every preservation cut point. Proven inside Electron against the real
      # src/ code, which is the whole reason it is not a vitest suite.
      #
      # Same xvfb + --no-sandbox treatment as the probe above, and for the same
      # reason — but the flag applies to the Electron parent only. The crashing
      # children the driver forks run as plain Node under ELECTRON_RUN_AS_NODE,
      # which rejects Chromium flags outright, so the driver deliberately does not
      # forward it (see the comment on `run_crashing_child`).
      #
      # The `bundle:desktop` here is the third in this job, and deliberately not
      # deduplicated: it takes a couple of seconds, and paying it buys a step that
      # cannot be broken by reordering or removing the ones above. The `&&` is
      # load-bearing — it is what stops a failed build from leaving a *stale*
      # bundle to be tested, which produces a confident report about code that is
      # no longer on disk.
      - name: Packaged SQLite recovery gates
        env:
          # Without this the driver would also pass by declaring the platform
          # unsupported and skipping every gate, which looks identical to the
          # gates having run and passed.
          TABLE_VIEWER_GATE_EXPECT_PLATFORM: supported
        run: npm run bundle:desktop && xvfb-run -a ./node_modules/.bin/electron --no-sandbox dist/runtime-probes/packaged-recovery-gate.js

      # The VS Code Extension Host is a GUI app; Linux runners are headless,
      # so launch it under a virtual framebuffer.
      - name: Integration tests (VS Code Extension Host)
        run: xvfb-run -a npm run test:integration

  # The plan's "packaged macOS clean relaunch and forced termination recover exact
  # state under rollback journal" gate. It has to be a macOS runner and a real
  # windowed app: the property is that the *whole* startup/quit path — reader
  # gate, connection, drain, journal replay — survives a restart, and no headless
  # substitute exercises it.
  #
  # Separate from the smoke suite proper, which is deliberately not in CI: the
  # focus-dependent specs there drive menu commands that only reach the grid while
  # the app is frontmost, so they fail on any machine whose desktop is being used
  # (documented in desktop/README.md). The relaunch specs use no menu commands and
  # no focus assertions, which is what makes them CI-safe when their siblings are
  # not. Keep that property when editing them, or this job becomes flaky.
  desktop-relaunch:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Electron (retry transient downloads)
        run: npm run desktop:ensure-electron

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Clean relaunch and SIGKILL relaunch. A forced termination leaves a hot
      # rollback journal and a stranded reader token on purpose — the token is
      # never reclaimed by PID or age — so the gate asserts the relaunch opens
      # anyway and claims no recovery it did not perform.
      - name: Packaged desktop relaunch gates
        run: npm run test:desktop-smoke:relaunch

  # Exercise the real electron-builder Windows path before a release tag exists.
  # Unit fixtures cannot establish which targets electron-builder includes in
  # latest.yml, and an incorrect assumption there previously broke v0.10.1.
  windows-packaging:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Windows packaging download caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-x64-arm64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-x64-arm64-
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Package desktop app (unsigned)
        run: npm run desktop:package:win

      - name: Validate Windows packages
        shell: bash
        working-directory: dist/desktop-packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(table-viewer-*.exe)
          if [[ "${#exes[@]}" -ne 4 ]]; then
            echo "ERROR: expected 4 .exe files (x64/arm64 x setup/portable), found ${#exes[@]}." >&2
            ls -la >&2
            exit 1
          fi
          VERSION=$(node -p "require('../../package.json').version")
          node ../../scripts/validate-update-metadata.mjs latest.yml "$VERSION" "table-viewer-${VERSION}-x64-setup.exe" --strict --require-blockmap
          node ../../scripts/validate-update-metadata.mjs latest-arm64.yml "$VERSION" "table-viewer-${VERSION}-arm64-setup.exe" --strict --require-blockmap
          node ../../scripts/validate-update-metadata.mjs latest-portable.yml "$VERSION" "table-viewer-${VERSION}-x64-portable.exe" --strict
          node ../../scripts/validate-update-metadata.mjs latest-portable-arm64.yml "$VERSION" "table-viewer-${VERSION}-arm64-portable.exe" --strict

      # Packaging success does not prove that the assisted NSIS installer can
      # install, register, launch, and remove the app. Exercise the host-native
      # setup executable in an isolated per-user directory. The script polls the
      # app window, state database, and uninstall result rather than relying on
      # fixed delays, so slow hosted runners do not turn this into a timing test.
      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          ./scripts/smoke-test-windows-installer.ps1 `
            -InstallerPath "dist/desktop-packages/table-viewer-$version-x64-setup.exe"

  windows-sqlite:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Electron (retry transient downloads)
        run: npm run desktop:ensure-electron

      - name: Typecheck
        run: npm run typecheck:all

      - name: Build portable update helper integration fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S desktop/native/windows-portable-update-helper -B dist/native-tests/windows-portable-update-helper -A x64 -DPORTABLE_UPDATE_HELPER_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build dist/native-tests/windows-portable-update-helper --config Release --target windows-portable-update-helper-test portable-update-old-fixture portable-update-new-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable update helper integration tests
        shell: pwsh
        env:
          PORTABLE_UPDATE_HELPER_TEST_BUILD_DIR: ${{ github.workspace }}\dist\native-tests\windows-portable-update-helper
        run: npx vitest run desktop/test/windows-portable-update-helper.integration.test.ts

      # Windows used to refuse the backend, and this step used to assert that
      # refusal. It now pins the opposite contract — a complete, valid v1 database
      # installed through the public entry point — so the platform cannot silently
      # start declining again.
      - name: SQLite public-open contract test
        run: npm run test:sqlite:public-open

      - name: Host Node SQLite runtime probe
        run: npm run probe:sqlite:host

      - name: Server bundle SQLite externalization probe
        run: npm run probe:sqlite:bundles

      - name: Electron SQLite runtime probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run bundle:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\node_modules\.bin\electron.cmd dist\runtime-probes\electron-sqlite-runtime-probe.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The same driver and the same contract as the Linux job. Windows is no
      # longer declined: the default Node directory primitive is attempted, and an
      # open result proving that no directory handle is available is skipped in
      # line with SQLite's own Windows posture. Once a handle is reachable, a
      # filesystem rejection still fails closed. The expectation is stated
      # explicitly so this can never pass by
      # declaring itself unsupported and skipping every gate.
      #
      # This is the first Windows run of the full recovery matrix; before the
      # refusal was relaxed the job asserted `unsupported` and skipped it.
      - name: Packaged SQLite recovery gates
        shell: pwsh
        env:
          TABLE_VIEWER_GATE_EXPECT_PLATFORM: supported
        run: |
          $ErrorActionPreference = 'Stop'
          # Builds its own bundle rather than inheriting the previous step's. A
          # reordering or a removal above would otherwise turn this gate into a
          # missing-file error — which fails, but for the wrong reason and without
          # having checked anything.
          npm run bundle:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\node_modules\.bin\electron.cmd dist\runtime-probes\packaged-recovery-gate.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The Windows durability verification gate. It decides nothing on its own; it
  # gathers the evidence the Windows decision tree turns on (see the comment block
  # at the top of desktop/windows-durability-probe.mjs and the "Windows durability
  # verification" section of desktop/README.md):
  #
  #   verifies       -> the Windows durability claim rests on the same evidence
  #                     standard as macOS's: a written durability contract plus
  #                     kill-crash verification against the packaged runtime.
  #   cannot verify  -> the Windows durability claim stays at SQLite's own posture
  #                     (no directory sync where the platform has no primitive for
  #                     one), with the uncovered cut points recorded as pending. The
  #                     backend ships either way; this job decides what the
  #                     durability claim is allowed to say, not whether it runs.
  #
  # Neither branch is a silent weakening, and *this job must not push the answer*.
  # A verdict of `not-verified` is information about the platform, not a broken
  # build, so it exits 0. Only a malfunction of the probe itself — a runner that
  # cannot make a temp directory, a child that cannot spawn, an unexpected throw —
  # is a failure, and the probe signals that with a non-zero exit of its own.
  windows-durability:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Electron (retry transient downloads)
        run: npm run desktop:ensure-electron

      - name: Windows durability verification probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Builds its own bundle rather than inheriting another job's, so a
          # reordering elsewhere cannot turn this into a missing-file error that
          # fails without having measured anything.
          npm run bundle:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\node_modules\.bin\electron.cmd dist\runtime-probes\windows-durability-probe.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
