name: Release Publish

on:
  workflow_run:
    workflows: [Release Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.1)'
        required: true
        type: string
      allow_missing_windows:
        description: 'Publish even though the Windows desktop artifact is absent. Only consulted for a hand-dispatched publish; the selected build run must still be successful, and this flag explicitly acknowledges the intended omission.'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-publish-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    environment: release

    steps:
      - name: Resolve immutable release commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          THE_TAG: ${{ env.RELEASE_TAG }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$THE_TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "ERROR: invalid release tag: $THE_TAG" >&2
            exit 1
          fi
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${THE_TAG}")
          TYPE=$(jq -r '.object.type' <<<"$OBJECT")
          TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          for _ in 1 2 3 4; do
            [[ "$TYPE" == "commit" ]] && break
            [[ "$TYPE" == "tag" ]] || { echo "ERROR: release tag did not resolve to a commit" >&2; exit 1; }
            OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}")
            TYPE=$(jq -r '.object.type' <<<"$OBJECT")
            TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          done
          if [[ "$TYPE" != "commit" || ! "$TAG_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release tag did not peel to a commit" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ || "$TAG_SHA" != "$RUN_HEAD_SHA" ]]; then
              echo "ERROR: release tag no longer matches the successful build commit" >&2
              exit 1
            fi
            RELEASE_SHA="$RUN_HEAD_SHA"
          else
            RELEASE_SHA="$TAG_SHA"
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '26.5.1'

      - name: Validate tag + version
        id: version
        shell: bash
        env:
          THE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$THE_TAG" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v0.1.1). Got: $THE_TAG" >&2
            exit 1
          fi

          if [[ "$THE_TAG" =~ [[:space:]] ]]; then
            echo "ERROR: tag must not contain whitespace. Got: $THE_TAG" >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "ERROR: checkout does not match the pinned release commit" >&2
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [[ "$THE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "ERROR: tag/version mismatch. tag=$THE_TAG package.json=$PKG_VERSION (expected tag $EXPECTED_TAG)" >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THE_TAG: ${{ env.RELEASE_TAG }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          # `workflow_run` (a pushed tag) or `workflow_dispatch` (a human). The
          # Windows branch below turns on which one this is, so it is read from a
          # named variable rather than interpolated into the middle of a
          # conditional.
          PUBLISH_TRIGGER: ${{ github.event_name }}
          # Only ever true when a human dispatched with it explicitly; the
          # workflow_run trigger has no way to supply it. See the Windows branch.
          ALLOW_MISSING_WINDOWS: ${{ inputs.allow_missing_windows }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          ARTIFACT_NAME="release-${THE_TAG}"

          valid_run() {
            jq -e \
              --arg sha "$RELEASE_SHA" \
              --arg tag "$THE_TAG" \
              --arg trigger "$PUBLISH_TRIGGER" '
                .name == "Release Build"
                and .path == ".github/workflows/release-build.yml"
                and .conclusion == "success"
                and (
                  (.event == "push" and .head_sha == $sha and .head_branch == $tag)
                  or ($trigger == "workflow_dispatch" and .event == "workflow_dispatch"
                    and .head_sha == $sha)
                )
              ' >/dev/null
          }

          if [[ "$PUBLISH_TRIGGER" == "workflow_run" ]]; then
            BUILD_RUN_ID="$WORKFLOW_RUN_ID"
            RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")
          else
            BUILD_RUN_ID=""
            RUN_JSON=""
            if ! CANDIDATES=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .workflow_run.id"); then
              echo "ERROR: could not list repository artifacts" >&2
              exit 1
            fi
            if [[ -n "$CANDIDATES" ]]; then
              while IFS= read -r candidate; do
                candidate_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}")
                if valid_run <<< "$candidate_json"; then
                  BUILD_RUN_ID="$candidate"
                  RUN_JSON="$candidate_json"
                  break
                fi
              done <<< "$CANDIDATES"
            fi
          fi

          if [[ -z "${BUILD_RUN_ID:-}" ]]; then
            echo "ERROR: No valid artifact found named '$ARTIFACT_NAME'" >&2
            echo "Make sure Release Build completed successfully for $THE_TAG" >&2
            exit 1
          fi

          if ! valid_run <<< "$RUN_JSON"; then
            echo "ERROR: artifact run is not a successful Release Build for the pinned release commit" >&2
            exit 1
          fi

          gh run download "$BUILD_RUN_ID" --name "$ARTIFACT_NAME"

          for required in \
            "table-viewer-${VERSION}.vsix" \
            "table-viewer-${VERSION}.vsix.sha256"; do
            if [[ ! -f "$required" ]]; then
              echo "ERROR: mandatory release artifact is missing: $required" >&2
              exit 1
            fi
          done

          # Only an *absent* artifact is tolerable (see below); a download that
          # fails on an artifact the run really has is a transient or permission
          # problem, and swallowing it would publish a release quietly missing
          # its downloads. So list the run's artifacts up front and let gh's exit
          # status stand for anything the list says is there. A failure of the
          # listing call itself is fatal too — it must not be mistaken for "the
          # run built no desktop artifacts".
          RUN_ARTIFACTS=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${BUILD_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')

          # The desktop job of the same run produces the macOS app that the
          # Homebrew cask downloads. Land it in desktop-dist/ rather than beside
          # the exact extension package and checksum paths, so desktop downloads
          # cannot be mistaken for extension release artifacts.
          #
          # Absent is not fatal: tags built before the desktop job existed, and
          # runs whose artifacts have aged out, have no desktop-* artifact. The
          # extension publish must not be held hostage to that — the release
          # simply ships without the app, and the cask bump is skipped.
          if grep -Fxq "desktop-${THE_TAG}" <<< "$RUN_ARTIFACTS"; then
            gh run download "$BUILD_RUN_ID" --name "desktop-${THE_TAG}" --dir desktop-dist
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No desktop-${THE_TAG} artifact; publishing without the macOS app and skipping the Homebrew bump."
          fi

          # Same story for the Windows exes, in their own directory for the same
          # reason. What a *missing* one means, though, depends entirely on which
          # trigger fired — and getting that wrong once made every tag-triggered
          # publish impossible, so the two cases are spelled out.
          #
          # release-build.yml's `desktop-windows` job packages nothing today: this
          # build cannot open its SQLite state database on Windows, so there is no
          # correct Windows artifact to publish. It reports that and exits 0 — it
          # does NOT fail — because Windows being unproven must never withhold the
          # macOS release. See the long comment on that job.
          #
          # `workflow_run` — a pushed tag. The build run's own conclusion is the
          # fence: this job's `if` requires `conclusion == 'success'`, so a build
          # that genuinely broke never gets here at all. Reaching here with no
          # `windows-<tag>` artifact is therefore the expected state of the fence,
          # not a lost artifact, and failing on it would block the macOS dmg, the
          # .vsix, the GitHub Release, and the Homebrew bump for a platform that was
          # never being shipped. Warn and continue.
          #
          # `workflow_dispatch` — a human. Artifact selection above still requires
          # a successful Release Build at the peeled tag commit, but this recovery
          # path is intentionally more explicit than the automatic tag flow: a human
          # must acknowledge the missing Windows download rather than inherit the
          # automatic trigger's expected-fence policy. Dispatch with
          # allow_missing_windows=true to say that omission is intended.
          if grep -Fxq "windows-${THE_TAG}" <<< "$RUN_ARTIFACTS"; then
            gh run download "$BUILD_RUN_ID" --name "windows-${THE_TAG}" --dir windows-dist
            echo "windows=true" >> "$GITHUB_OUTPUT"
          elif [[ "$PUBLISH_TRIGGER" == "workflow_run" ]]; then
            echo "windows=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No windows-${THE_TAG} artifact; publishing without the Windows app. The desktop-windows job in release-build.yml is fenced off pending durability verification, and the build run's own success is what vouches for this publish."
          elif [[ "${ALLOW_MISSING_WINDOWS:-false}" == "true" ]]; then
            echo "windows=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No windows-${THE_TAG} artifact; publishing without the Windows app because allow_missing_windows was set."
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
            cat >&2 <<MESSAGE
          ERROR: no windows-${THE_TAG} artifact, and this hand-dispatched publish would
          ship a release without the Windows downloads.

          The selected artifact is from a successful Release Build at the peeled tag
          commit, but hand-dispatched publishes require explicit acknowledgement of the
          omission rather than inheriting the automatic tag flow's expected-fence policy.

          Re-run the build for this tag, or, if Windows is meant to be omitted from the
          release page, say so explicitly:

            gh workflow run release-publish.yml -f tag=${THE_TAG} -f allow_missing_windows=true
          MESSAGE
            exit 1
          fi

      - name: Verify extension and desktop checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum -c "table-viewer-${VERSION}.vsix.sha256"
          if [[ "${{ steps.artifacts.outputs.desktop }}" == "true" ]]; then
            (cd desktop-dist && sha256sum -c ./*.sha256)
          fi
          if [[ "${{ steps.artifacts.outputs.windows }}" == "true" ]]; then
            (cd windows-dist && sha256sum -c ./*.sha256)
          fi

      - name: Install locked publish tools
        working-directory: .github/release-tools
        run: npm ci --ignore-scripts

      - name: Revalidate release tag before Marketplace publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${THE_TAG}")
          TYPE=$(jq -r '.object.type' <<<"$OBJECT")
          CURRENT_TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          for _ in 1 2 3 4; do
            [[ "$TYPE" == "commit" ]] && break
            [[ "$TYPE" == "tag" ]] || { echo "ERROR: release tag no longer resolves to a commit" >&2; exit 1; }
            OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${CURRENT_TAG_SHA}")
            TYPE=$(jq -r '.object.type' <<<"$OBJECT")
            CURRENT_TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          done
          if [[ "$TYPE" != "commit" || "$CURRENT_TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release tag moved before Marketplace publication" >&2
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        run: .github/release-tools/node_modules/.bin/vsce publish --skip-duplicate --packagePath "table-viewer-${VERSION}.vsix" --pat "$VSCE_PAT"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Revalidate release tag before Open VSX publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${THE_TAG}")
          TYPE=$(jq -r '.object.type' <<<"$OBJECT")
          CURRENT_TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          for _ in 1 2 3 4; do
            [[ "$TYPE" == "commit" ]] && break
            [[ "$TYPE" == "tag" ]] || { echo "ERROR: release tag no longer resolves to a commit" >&2; exit 1; }
            OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${CURRENT_TAG_SHA}")
            TYPE=$(jq -r '.object.type' <<<"$OBJECT")
            CURRENT_TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          done
          if [[ "$TYPE" != "commit" || "$CURRENT_TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release tag moved before Open VSX publication" >&2
            exit 1
          fi

      - name: Publish to Open VSX
        run: .github/release-tools/node_modules/.bin/ovsx publish --skip-duplicate "table-viewer-${VERSION}.vsix" --pat "$OVSX_PAT"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Revalidate release tag before GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${THE_TAG}")
          TYPE=$(jq -r '.object.type' <<<"$OBJECT")
          CURRENT_TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          for _ in 1 2 3 4; do
            [[ "$TYPE" == "commit" ]] && break
            [[ "$TYPE" == "tag" ]] || { echo "ERROR: release tag no longer resolves to a commit" >&2; exit 1; }
            OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${CURRENT_TAG_SHA}")
            TYPE=$(jq -r '.object.type' <<<"$OBJECT")
            CURRENT_TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          done
          if [[ "$TYPE" != "commit" || "$CURRENT_TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release tag moved before GitHub Release" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # fail_on_unmatched_files defaults to false, so the desktop-dist
          # globs are a no-op when this tag has no desktop artifact (see the
          # download step) rather than failing the release.
          files: |
            table-viewer-${{ steps.version.outputs.version }}.vsix
            table-viewer-${{ steps.version.outputs.version }}.vsix.sha256
            desktop-dist/table-viewer-*.dmg
            desktop-dist/table-viewer-*.zip
            desktop-dist/*.sha256
            windows-dist/table-viewer-*.exe
            windows-dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With the release published (and the dmg attached above), open a PR
      # against the Homebrew tap (jbearak/homebrew-table-viewer) bumping the
      # cask to this version, with the checksum recomputed from the very
      # artifact this run published. Keeping these steps in the `release`
      # environment lets HOMEBREW_TAP_TOKEN live as an environment secret
      # without a second release approval.
      #
      # Setup (one-time), then these steps activate themselves:
      #   gh secret   set HOMEBREW_TAP_TOKEN   -R jbearak/table-viewer --env release
      #   gh variable set ENABLE_HOMEBREW_BUMP -R jbearak/table-viewer --body true
      # HOMEBREW_TAP_TOKEN: a GitHub App installation token or fine-grained PAT
      # scoped to jbearak/homebrew-table-viewer with Contents:write +
      # Pull requests:write.
      - name: Revalidate release tag before Homebrew bump
        if: vars.ENABLE_HOMEBREW_BUMP == 'true' && steps.artifacts.outputs.desktop == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${THE_TAG}")
          TYPE=$(jq -r '.object.type' <<<"$OBJECT")
          CURRENT_TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          for _ in 1 2 3 4; do
            [[ "$TYPE" == "commit" ]] && break
            [[ "$TYPE" == "tag" ]] || { echo "ERROR: release tag no longer resolves to a commit" >&2; exit 1; }
            OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${CURRENT_TAG_SHA}")
            TYPE=$(jq -r '.object.type' <<<"$OBJECT")
            CURRENT_TAG_SHA=$(jq -r '.object.sha' <<<"$OBJECT")
          done
          if [[ "$TYPE" != "commit" || "$CURRENT_TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release tag moved before the Homebrew bump" >&2
            exit 1
          fi

      - name: Resolve Homebrew tap snapshot
        id: tap
        if: vars.ENABLE_HOMEBREW_BUMP == 'true' && steps.artifacts.outputs.desktop == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAP_SHA=$(gh api repos/jbearak/homebrew-table-viewer/commits/main --jq '.sha')
          if [[ ! "$TAP_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Homebrew tap did not resolve to a commit" >&2
            exit 1
          fi
          echo "sha=$TAP_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap data
        if: vars.ENABLE_HOMEBREW_BUMP == 'true' && steps.artifacts.outputs.desktop == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: jbearak/homebrew-table-viewer
          ref: ${{ steps.tap.outputs.sha }}
          # Public repo: no token needed to clone, and persist-credentials:false
          # keeps any credential out of tap/.git/config. The tap PAT is supplied
          # only at push time (below), never persisted to disk.
          persist-credentials: false
          path: tap

      - name: Bump Homebrew cask
        if: vars.ENABLE_HOMEBREW_BUMP == 'true' && steps.artifacts.outputs.desktop == 'true'
        shell: bash
        env:
          THE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMG=(desktop-dist/table-viewer-*.dmg)
          if [[ "${#DMG[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one desktop dmg" >&2
            exit 1
          fi
          VERSION="${THE_TAG#v}"
          SHA256="$(sha256sum "${DMG[0]}" | cut -d' ' -f1)"
          CASK_PATH="tap/Casks/table-viewer.rb"
          export VERSION SHA256 CASK_PATH
          node <<'NODE'
          const fs = require('node:fs');
          const semver = require('./.github/release-tools/node_modules/semver');

          const path = process.env.CASK_PATH;
          const targetVersion = process.env.VERSION;
          const targetChecksum = process.env.SHA256;
          const text = fs.readFileSync(path, 'utf8');
          const versionPattern = /^([ \t]*)version[ \t]+"([^"]+)"[ \t]*$/gm;
          const checksumPattern = /^([ \t]*)sha256[ \t]+"([0-9a-f]+)"[ \t]*$/gm;
          const versions = [...text.matchAll(versionPattern)];
          const checksums = [...text.matchAll(checksumPattern)];
          if (versions.length !== 1) throw new Error('expected exactly one cask version');
          if (checksums.length !== 1) throw new Error('expected exactly one cask checksum');
          const currentVersion = versions[0][2];
          if (!semver.valid(currentVersion) || !semver.valid(targetVersion)) {
              throw new Error(`invalid cask version transition ${currentVersion} -> ${targetVersion}`);
          }
          const comparison = semver.compare(currentVersion, targetVersion);
          if (comparison === 0 && currentVersion !== targetVersion) {
              throw new Error(
                  `ambiguous equal-precedence cask transition ${currentVersion} -> ${targetVersion}`,
              );
          }
          if (comparison > 0) {
              console.log(
                  `Homebrew cask ${currentVersion} is newer than ${targetVersion}; skipping downgrade.`,
              );
              process.exit(0);
          }
          let updated = text;
          if (comparison < 0) {
              updated = updated.replace(
                  versionPattern,
                  (_match, indent) => `${indent}version "${targetVersion}"`,
              );
          }
          if (comparison < 0 || checksums[0][2] !== targetChecksum) {
              updated = updated.replace(
                  checksumPattern,
                  (_match, indent) => `${indent}sha256 "${targetChecksum}"`,
              );
          }
          fs.writeFileSync(path, updated);
          NODE

      - name: Open Homebrew bump PR + enable auto-merge
        if: vars.ENABLE_HOMEBREW_BUMP == 'true' && steps.artifacts.outputs.desktop == 'true'
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          THE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          VERSION="${THE_TAG#v}"
          if git diff --quiet; then
            echo "Cask already at $VERSION - nothing to do."
            exit 0
          fi
          BRANCH="bump-table-viewer-$VERSION"
          git config user.name "table-viewer-release-bot"
          git config user.email "table-viewer-release-bot@users.noreply.github.com"
          # Only this job ever writes bump-table-viewer-*, so reset the branch
          # from HEAD and force-push. No remote-tracking ref / pre-fetch needed,
          # so reruns can't fail on a stale lease.
          git checkout -B "$BRANCH"
          git add Casks/table-viewer.rb
          git commit -m "table-viewer $VERSION"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$AUTH_HEADER" push --force origin "HEAD:$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" \
                --title "table-viewer $VERSION" \
                --body "Automated cask bump for [Table Viewer $VERSION](https://github.com/jbearak/table-viewer/releases/tag/$THE_TAG). Checksum recomputed from the release artifact."; then
            if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
              echo "PR for $BRANCH already exists; the force-push updated it."
            else
              echo "::error::gh pr create failed for $BRANCH" >&2
              exit 1
            fi
          fi
          gh pr merge "$BRANCH" --auto --squash \
            || echo "::warning::could not enable auto-merge; merge $BRANCH manually."
