# electron-builder configuration for the standalone Table Viewer app.
#
# Build with: npm run desktop:package (macOS dmg + zip), npm run
# desktop:package:dir (unpacked .app for quick local verification), or npm run
# desktop:package:win (Windows setup + portable .exe). Each target must be
# built on its own OS, so the release workflow uses one runner per platform.
#
# macOS signing is deliberately NOT pinned here. This file leaves mac.identity
# unset, which is electron-builder's "sign if a Developer ID certificate is
# available" mode, so the release workflow only has to supply CSC_LINK /
# CSC_KEY_PASSWORD to get a signed build and needs no cert name in config.
# Callers that must not sign pass the unsigned flags explicitly:
#
#   -c.mac.identity=null -c.dmg.sign=false
#
# The desktop:package npm scripts do exactly that, so a local build never
# needs a certificate. See .github/workflows/release-build.yml for the
# signed/notarized path.
appId: com.jbearak.table-viewer
productName: Table Viewer
directories:
  output: dist/desktop-packages
# productName has a space, which would land in the release URL the Homebrew
# cask downloads; name the artifacts after the slug instead.
artifactName: table-viewer-${version}-${arch}.${ext}
# The desktop bundles are self-contained (esbuild); no node_modules ship.
files:
  - dist/desktop/**
  - '!dist/desktop/*.map'
  - '!dist/desktop/THIRD_PARTY_NOTICES.txt'
  - dist/webview/**
  - package.json
  - LICENSE
  - '!node_modules/**'
# License notices for the GPL-3.0 app: our own LICENSE, the generated npm
# third-party attribution (desktop/collect-licenses.mjs), and Electron's own
# license + Chromium third-party notices from the electron dist.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: dist/desktop/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
# A missing extraResources source is only a *warning* in electron-builder, so a
# half-installed node_modules/electron silently yields a bundle with no Electron
# or Chromium notices. This hook fails the build instead — we must not ship a
# GPL-3.0 app without its attributions.
afterPack: desktop/after-pack.mjs
extraMetadata:
  main: dist/desktop/main.js
# Nothing native to rebuild (bundles are pure JS); skip the npm rebuild step.
npmRebuild: false
mac:
  category: public.app-category.productivity
  # Declare the app as *a* handler for table files so it appears in Finder's
  # "Open with…" menu. role/rank deliberately avoid claiming OS
  # default-handler status.
  #
  # Scoped to `mac` rather than declared at the top level because
  # electron-builder *concatenates* the root and per-platform lists — a
  # top-level entry reaches every platform and cannot be overridden per
  # platform. Windows must not use these: `rank`/`role` are macOS-only, and
  # electron-builder's NSIS association macro seizes the default handler.
  # Windows registers its own, correctly, in desktop/installer.nsh.
  fileAssociations:
    - ext: csv
      name: CSV
      description: Comma-separated values
      role: Editor
      rank: Alternate
    - ext: tsv
      name: TSV
      description: Tab-separated values
      role: Editor
      rank: Alternate
    - ext: xlsx
      name: Excel Workbook
      description: Excel workbook
      role: Viewer
      rank: Alternate
    - ext: xls
      name: Excel 97-2003 Workbook
      description: Legacy Excel workbook
      role: Viewer
      rank: Alternate
  # 1024x1024 master; electron-builder generates the .icns slices at package
  # time. This is also the auto-detected default path — explicit for clarity.
  icon: build/icon.png
  # Required for notarization, and inert without a signing identity. Electron
  # needs the JIT/unsigned-memory entitlements that electron-builder applies by
  # default under a hardened runtime, so no custom entitlements plist.
  hardenedRuntime: true
  # `spctl --assess` cannot pass on an unsigned build and would fail packaging.
  # Notarization (release workflow) is the real Gatekeeper gate.
  gatekeeperAssess: false
  target:
    - dmg
    - zip
# Windows ships unsigned: certificates are expensive and this project isn't
# developed on Windows. So SmartScreen shows its "Windows protected your PC"
# interstitial on first run and the user clicks More info -> Run anyway. Worth
# knowing before buying one: a cheap OV cert wouldn't remove that interstitial,
# since SmartScreen reputation accrues per publisher against download volume.
# Nothing in this config or the release workflow tries to sign, and
# CSC_IDENTITY_AUTO_DISCOVERY is pinned off in CI so a stray certificate in a
# runner's store can't silently change the artifact.
win:
  # Same 1024x1024 master as macOS; electron-builder renders the .ico slices.
  icon: build/icon.png
  target:
    # Two shapes, because Windows has no single convention: the NSIS installer
    # for people who want Start Menu + "Open with…" + an uninstaller entry, and
    # the portable single .exe for locked-down machines that can't install.
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
nsis:
  # An assisted (wizard) installer rather than the one-click default.
  #
  # oneClick: false + perMachine: false is electron-builder's "show the install
  # mode page" combination: the user picks between installing just for
  # themselves (%LOCALAPPDATA%, no UAC) and for all users (Program Files, UAC
  # prompt). Per-user is the default selection, so nobody is *forced* to
  # elevate for an unsigned binary already fighting SmartScreen, but the
  # all-users option stays available for machine-wide deployments.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Table Viewer
  # File-type registration, hand-written because electron-builder's generated
  # associations would hijack the user's default handler for .csv/.xlsx. See
  # the file for the full explanation.
  include: desktop/installer.nsh
  # Default is a single installer carrying both architectures. Build one per
  # arch instead so the download matches the ${arch} in artifactName and an
  # arm64 laptop isn't made to download the x64 payload it won't run.
  buildUniversalInstaller: false
  # There is no auto-update channel, so the .blockmap files electron-builder
  # otherwise emits next to each installer are unused weight on the release page.
  differentialPackage: false
  # nsis and portable are both `.exe`, so the shared artifactName above would
  # have them overwrite each other. Disambiguate per target.
  artifactName: table-viewer-${version}-${arch}-setup.${ext}
portable:
  # Same reasoning as nsis above: one exe per arch, not a combined one.
  buildUniversalInstaller: false
  artifactName: table-viewer-${version}-${arch}-portable.${ext}
