<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';">
<title>Preferences</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 20px 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background: var(--prefs-bg, #ffffff);
    color: var(--prefs-fg, #3b3b3b);
    user-select: none;
  }
  h1 { font-size: 15px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
  label { font-weight: 600; }
  .hint { color: var(--prefs-muted, #717171); font-size: 12px; }
  input, select {
    font: inherit;
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid var(--prefs-border, #cecece);
    background: var(--prefs-input-bg, #ffffff);
    color: inherit;
    max-width: 240px;
  }
  #status { color: var(--prefs-muted, #717171); font-size: 12px; height: 16px; }
</style>
</head>
<body>
<h1>Table Viewer Preferences</h1>
<div class="field">
  <label for="fontFamily">Font family</label>
  <input id="fontFamily" type="text" placeholder="Theme default">
  <span class="hint">Font used in table views. Leave empty for the default.</span>
</div>
<div class="field">
  <label for="tabOrientation">Worksheet tab orientation</label>
  <select id="tabOrientation">
    <option value="horizontal">Horizontal</option>
    <option value="vertical">Vertical</option>
  </select>
</div>
<div class="field">
  <label for="csvMaxRows">Max CSV/TSV rows</label>
  <input id="csvMaxRows" type="number" min="1" step="1">
  <span class="hint">Rows beyond this are truncated with a banner.</span>
</div>
<div class="field">
  <label for="maxFileSizeMiB">Max file size (MiB)</label>
  <input id="maxFileSizeMiB" type="number" min="1">
</div>
<div id="status"></div>
<script src="./prefs.js"></script>
</body>
</html>
