<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';">
<title>Table Viewer Update</title>
<style>
  :root {
    color-scheme: light dark;
    --update-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --update-font-size: 13px;
  }
  body {
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    min-height: 100vh;
    overflow-y: auto;
    font-family: var(--update-font-family);
    font-size: var(--update-font-size);
    background: var(--update-bg, #ffffff);
    color: var(--update-fg, #3b3b3b);
    user-select: none;
  }
  .message { display: grid; grid-template-columns: 42px 1fr; gap: 14px; align-items: start; }
  #icon {
    width: 42px; height: 42px; border-radius: 10px;
    display: grid; place-items: center;
    color: var(--update-primary-bg, #087cd5);
    background: color-mix(in srgb, var(--update-primary-bg, #087cd5) 14%, transparent);
    font-size: calc(var(--update-font-size) * 1.85); font-weight: 600;
  }
  h1 { margin: 1px 0 7px; font-size: calc(var(--update-font-size) * 1.3); font-weight: 600; }
  p { margin: 0; line-height: 1.45; }
  #detail { color: var(--update-muted, #717171); }
  #dismissalNote {
    margin: 16px 0 0 56px; padding: 9px 11px;
    border-radius: 6px;
    background: var(--update-button-bg, #f3f3f3);
    color: var(--update-muted, #717171);
    font-size: calc(var(--update-font-size) * 0.92);
  }
  #progress { margin: 18px 0 0 56px; }
  progress { display: block; width: 100%; height: 7px; accent-color: var(--update-progress-bg, #087cd5); }
  .progress-meta {
    display: flex; justify-content: space-between; gap: 12px; margin-top: 6px;
    color: var(--update-muted, #717171);
    font-size: calc(var(--update-font-size) * 0.92);
  }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin: 20px 0 0 56px; }
  button {
    font: inherit; padding: 6px 11px; border-radius: 5px;
    border: 1px solid var(--update-border, #cecece);
    background: var(--update-button-bg, #f8f8f8);
    color: inherit; cursor: pointer;
  }
  button:hover { background: var(--update-hover-bg, rgba(128,128,128,0.2)); }
  #primary {
    border-color: var(--update-primary-bg, #087cd5);
    background: var(--update-primary-bg, #087cd5);
    color: var(--update-primary-fg, #ffffff);
  }
  #primary:hover { background: var(--update-primary-hover-bg, #0069b8); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="message">
    <div id="icon" aria-hidden="true">↓</div>
    <div>
      <h1 id="heading" aria-live="polite" aria-atomic="true">Table Viewer update</h1>
      <p id="detail"></p>
    </div>
  </div>
  <p id="dismissalNote" hidden></p>
  <div id="progress" hidden>
    <progress id="progressBar" max="100" aria-label="Update download progress"></progress>
    <div class="progress-meta"><span id="progressAmount"></span><span id="progressPercent"></span></div>
  </div>
  <div class="actions">
    <button id="secondary" type="button"></button>
    <button id="primary" type="button"></button>
  </div>
</main>
<script src="./app-update.js"></script>
</body>
</html>
