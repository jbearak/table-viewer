<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';">
<title>About Table Viewer</title>
<style>
  :root {
    color-scheme: light dark;
    /* Set from the font settings (desktop/renderer/about.ts): the font
       preference applies to the whole app, this window included. */
    --about-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --about-font-size: 13px;
  }
  body {
    margin: 0; padding: 24px 20px; box-sizing: border-box;
    height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    text-align: center;
    font-family: var(--about-font-family);
    font-size: var(--about-font-size);
    background: var(--about-bg, #ffffff);
    color: var(--about-fg, #3b3b3b);
    user-select: none;
  }
  h1 { font-size: calc(var(--about-font-size) * 1.45); margin: 0; font-weight: 600; }
  #version { color: var(--about-muted, #717171); }
  .legal {
    color: var(--about-muted, #717171);
    font-size: calc(var(--about-font-size) * 0.92);
    line-height: 1.45;
    max-width: 300px;
  }
  #links { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  /* Buttons, not <a href>: the CSP above blocks navigation, and links are
     opened by the main process through shell.openExternal instead. */
  button {
    font: inherit; padding: 5px 10px; border-radius: 5px;
    border: 1px solid var(--about-border, #cecece);
    background: var(--about-button-bg, #f8f8f8);
    color: inherit; cursor: pointer;
  }
  button:hover { background: var(--about-hover-bg, rgba(128,128,128,0.2)); }
</style>
</head>
<body>
<!-- Hardcoded: `app.name` is the package name (`table-viewer`) in a dev run,
     because electron-builder's productName only applies to a packaged app. The
     version is filled in from IPC (desktop/renderer/about.ts) with a constant
     injected from the root package.json at build time — `app.getVersion()`
     reports Electron's own version in an unpackaged run (see __APP_VERSION__ in
     desktop/main/main.ts). -->
<h1>Table Viewer</h1>
<div id="version"></div>
<p class="legal">
  Copyright © Jonathan Marc Bearak. Licensed under version 3 of the GNU General
  Public License. This program comes with ABSOLUTELY NO WARRANTY.
</p>
<div id="links">
  <button id="license" type="button">License (GPL-3.0)</button>
  <button id="notices" type="button">Third-party notices</button>
  <button id="bundledNotices" type="button">Bundled package licenses…</button>
</div>
<script src="./about.js"></script>
</body>
</html>
